services:
  - type: web
    name: zeal-college-erp
    env: node
    plan: free
    buildCommand: npm --prefix backend install --include=dev && npm --prefix frontend install --include=dev && cd backend && npx prisma generate && npx prisma db push && cd .. && npm --prefix backend run build && npm --prefix frontend run build
    startCommand: cd backend && npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./prisma/erp.db
      - key: COLLEGE_NAME
        value: Zeal College of Engineering and Research
      - key: COLLEGE_CODE
        value: ZCOER

